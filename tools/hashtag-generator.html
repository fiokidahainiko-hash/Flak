<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free TikTok Hashtag Generator | Flak</title>

<meta name="description" content="Generate trending TikTok hashtags instantly with Flak.">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f7fb;
}

header{
    background:#0d6efd;
    color:white;
    padding:18px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
    margin:0;
}

input,select{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    background:#0d6efd;
    color:white;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}

#hashtags{
    margin-top:20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.tag{
    background:#0d6efd;
    color:white;
    padding:8px 12px;
    border-radius:20px;
    font-size:14px;
}

</style>

</head>
<script>

const commonTags = [
"fyp",
"viral",
"trending",
"tiktok",
"explore",
"foryou",
"foryoupage",
"video",
"creator",
"content"
];

const categoryTags = {
General:["trend","popular","discover"],
Gaming:["gaming","gamer","gameplay","esports"],
Music:["music","song","artist","beats"],
Fitness:["fitness","gym","workout","health"],
Fashion:["fashion","style","outfit","ootd"],
Food:["food","recipe","delicious","foodie"],
Business:["business","money","startup","success"]
};

function generateHashtags(){

const keyword = document
.getElementById("keyword")
.value
.trim()
.toLowerCase();

const category = document
.getElementById("category")
.value;

const container =
document.getElementById("hashtags");

container.innerHTML="";

if(keyword===""){
alert("Please enter a keyword.");
return;
}

let tags=[];

tags.push("#"+keyword);
tags.push("#"+keyword+"tips");
tags.push("#"+keyword+"video");
tags.push("#"+keyword+"2026");
tags.push("#"+keyword+"tok");

commonTags.forEach(tag=>{
tags.push("#"+tag);
});

categoryTags[category].forEach(tag=>{
tags.push("#"+tag);
});

tags=[...new Set(tags)];

tags.forEach(tag=>{

const span=document.createElement("span");

span.className="tag";

span.textContent=tag;

container.appendChild(span);

});

}

</script>
<body>

<header>
<h1>Flak Hashtag Generator</h1>
</header>

<div class="container">

<div class="card">

<h2>Generate TikTok Hashtags</h2>

<input
id="keyword"
type="text"
placeholder="Example: Football">

<select id="category">

<option>General</option>

<option>Gaming</option>

<option>Music</option>

<option>Fitness</option>

<option>Fashion</option>

<option>Food</option>

<option>Business</option>

</select>

<button>
Generate Hashtags
</button>

<div id="hashtags"></div>

</div>

</div>

</body>
</html>

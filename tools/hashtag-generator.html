<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free TikTok Hashtag Generator | Flak</title>

<meta name="description" content="Generate trending TikTok hashtags instantly with Flak.">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f7fb;
}

header{
    background:#0d6efd;
    color:white;
    padding:18px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
    margin:0;
}

input,select{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    background:#0d6efd;
    color:white;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}

#hashtags{
    margin-top:20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.tag{
    background:#0d6efd;
    color:white;
    padding:8px 12px;
    border-radius:20px;
    font-size:14px;
}

</style>

</head>
<script>
const hashtagDatabase = {

general:[
"fyp","foryou","foryoupage","viral","trending","explore","tiktok",
"viralvideo","trend","discover","creator","contentcreator",
"videooftheday","dailycontent","socialmedia","viralcontent",
"reels","shortvideo","content","explorepage"
],

football:[
"football","footballtok","footballlife","footballskills",
"footballtraining","footballnews","footballfans","footballclub",
"footballplayer","footballhighlights","footballreels",
"footballcommunity","soccer","goal","goals","matchday",
"premierleague","championsleague","laliga","seriea",
"bundesliga","uefa","fifa","worldcup","ball","training",
"soccerlife","sports","sport","footballlove"
],

gaming:[
"gaming","gamertok","gamingtiktok","gamer","gamingclips",
"gamingcommunity","gameplay","esports","fortnite",
"minecraft","valorant","pubg","freefire","roblox",
"xbox","playstation","pcgaming","gaminglife",
"gamingsetup","streamer","livestream","gamingfun",
"gamingnews","gamingtips","fps","mobilegaming",
"gamingvideos","games","console","epicgaming"
],

music:[
"music","musictok","musiclover","musician","beats",
"song","songs","artist","producer","dj","studio",
"recording","playlist","viralmusic","newmusic",
"hiphop","rap","afrobeats","popmusic","concert",
"livemusic","vocals","guitar","piano","singing",
"cover","remix","musicproducer","sound","audio"
],

fashion:[
"fashion","fashiontok","style","ootd","outfit",
"streetstyle","fashionstyle","fashionblogger",
"styleinspo","lookbook","outfitideas","aesthetic",
"fashiontrends","clothing","designer","luxury",
"shopping","model","wardrobe","fashiondaily",
"vintage","casualstyle","mensfashion",
"womensfashion","trendsetter","chic","fashiongram",
"beauty","stylish","look"
],

fitness:[
"fitness","fittok","gym","workout","bodybuilding",
"muscle","cardio","training","fitfam",
"gymmotivation","exercise","health","wellness",
"strength","running","weightloss","fatloss",
"homeworkout","fitnessmotivation","fitnessjourney",
"fitlife","gymtok","fitnessgoals","healthy",
"healthylifestyle","fitspo","motivation",
"gymtime","coach","trainer"
],

food:[
"food","foodtok","foodie","recipe","recipes",
"cooking","chef","dessert","streetfood",
"healthyrecipes","mealprep","homemade","kitchen",
"tasty","delicious","breakfast","lunch","dinner",
"snacks","foodlover","cookingtips","restaurant",
"baking","quickmeals","comfortfood","yum",
"foodblogger","easyrecipes","drinks","coffee"
],

technology:[
"technology","tech","coding","developer","programming",
"software","javascript","python","webdevelopment",
"artificialintelligence","ai","machinelearning",
"cybersecurity","gadgets","innovation","startup",
"cloud","github","codinglife","developerlife",
"reactjs","html","css","technews","automation",
"futuretech","computer","digital","codingtips","opensource"
]

};
function generateHashtags(){

const keyword=document
.getElementById("keyword")
.value
.trim()
.toLowerCase();

const category=document
.getElementById("category")
.value
.toLowerCase();

const result=document
.getElementById("hashtags");

result.innerHTML="";

if(keyword==""){
alert("Enter a keyword");
return;
}

let hashtags=[];

hashtags.push("#"+keyword);
hashtags.push("#"+keyword+"tips");
hashtags.push("#"+keyword+"video");
hashtags.push("#"+keyword+"tok");
hashtags.push("#"+keyword+"viral");
hashtags.push("#"+keyword+"2026");
hashtags.push("#"+keyword+"community");
hashtags.push("#"+keyword+"creator");
hashtags.push("#"+keyword+"life");
hashtags.push("#"+keyword+"content");

hashtagDatabase.general.forEach(tag=>{
hashtags.push("#"+tag);
});

if(hashtagDatabase[category]){
hashtagDatabase[category].forEach(tag=>{
hashtags.push("#"+tag);
});

}

hashtags=[...new Set(hashtags)];

hashtags.sort(()=>Math.random()-0.5);

hashtags.slice(0,35).forEach(tag=>{

const span=document.createElement("span");

span.className="tag";

span.innerHTML=tag;

result.appendChild(span);

});

}




</script>
<body>

<header>
<h1>Flak Hashtag Generator</h1>
</header>

<div class="container">

<div class="card">

<h2>Generate TikTok Hashtags</h2>

<input
id="keyword"
type="text"
placeholder="Example: Football">

<select id="category">

<option>General</option>

<option>Gaming</option>

<option>Music</option>

<option>Fitness</option>

<option>Fashion</option>

<option>Food</option>

<option>Business</option>

</select>

<button onclick="generateHashtags()">
Generate Hashtags
</button>

<div id="hashtags"></div>

</div>

</div>

</body>
</html>

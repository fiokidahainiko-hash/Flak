<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fcsBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="55%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="fcsSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFEFFF"/>
    </linearGradient>
    <filter id="fcsGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer glow ring -->
  <rect x="6" y="6" width="108" height="108" rx="30" fill="none" stroke="url(#fcsBadge)" stroke-width="2.5" opacity="0.55" filter="url(#fcsGlow)"/>

  <!-- badge -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#fcsBadge)" filter="url(#fcsGlow)"/>
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#fcsBadge)" opacity="0.001"/>

  <!-- inner glass highlight -->
  <rect x="14" y="14" width="92" height="46" rx="22" fill="#FFFFFF" opacity="0.08"/>

  <!-- spark + play mark: creative flash forming a play triangle -->
  <path d="M64 26 L40 62 H55 L48 94 L82 54 H65 Z" fill="url(#fcsSpark)" filter="url(#fcsGlow)"/>

  <!-- studio aperture dots -->
  <circle cx="30" cy="90" r="3.2" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="40" cy="96" r="2.2" fill="#FFFFFF" opacity="0.6"/>
</svg>
